- name: Ensure the rdf_datasets directory exists
  ansible.builtin.file:
    path: "{{ endpoint_data_dir }}/rdf_datasets"
    state: directory
    mode: "0755"

- name: Print the dataset target path
  ansible.builtin.debug:
    msg: "Extracting datasets into target directory: {{ endpoint_data_dir }}/rdf_datasets"

- name: Download rdf_datasets.zip
  ansible.builtin.get_url:
    url: "https://zenodo.org/records/22140177/files/rdf_datasets.zip?download=1"
    dest: "/tmp/rdf_datasets.zip"
    mode: "0644"

- name: Extract rdf_datasets.zip into the rdf_datasets directory
  ansible.builtin.unarchive:
    src: "/tmp/rdf_datasets.zip"
    dest: "{{ endpoint_data_dir }}/rdf_datasets"
    remote_src: true

- name: Remove the downloaded archive
  ansible.builtin.file:
    path: "/tmp/rdf_datasets.zip"
    state: absent

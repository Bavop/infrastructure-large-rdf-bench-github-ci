- name: Update apt cache and upgrade packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  become: true

- name: Install base dependencies
  ansible.builtin.apt:
    name:
      - curl
      - wget
      - unzip             # needed by ansible.builtin.unarchive for .zip extraction
      - git
      - ca-certificates
    state: present
    update_cache: true
  become: true

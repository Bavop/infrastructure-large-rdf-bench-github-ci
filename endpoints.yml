# run_once below because every dataset in the `endpoints` group currently
# shares the same physical machine -- Docker/image/data-dir setup only needs
# to happen once, not once per dataset (same caveat as in common.yml).
- name: Provision the SPARQL endpoint nodes
  hosts: all
  gather_facts: true
  gather_subset: min
  tasks:
    - name: Install Docker and pull the QLever image
      ansible.builtin.include_tasks: tasks/endpoint_setup.yml
      run_once: true

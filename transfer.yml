# Build and serve each dataset's QLever index, fronted by a shared Caddy that
# enforces the access token (see tasks/start_endpoint.yml). Run after the RDF
# data is already on the host under endpoint_data_dir (see tasks/transfer.yml
# for the one-off download step, currently disabled below since the data is
# already in place).
- name: Build and serve every dataset's QLever endpoint
  hosts: all
  gather_facts: true
  gather_subset: min
  tasks:
    - name: Download and extract the RDF datasets
      ansible.builtin.include_tasks: tasks/transfer.yml

    - name: Build and serve this dataset's QLever index
      ansible.builtin.include_tasks: tasks/start_endpoint.yml

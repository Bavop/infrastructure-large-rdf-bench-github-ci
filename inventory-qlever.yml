# =============================================================================
# QLever endpoints -- one per dataset, each its own container on its own port.
#
# For now every dataset points at the SAME physical machine (ansible_host) --
# they're all just different ports on one box, fronted by one shared Caddy
# (see tasks/start_endpoint.yml). To move a dataset to a real separate host
# later, just give it its own ansible_host; the port numbering is arbitrary
# and only needs to be unique per machine.
# =============================================================================

all:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: /home/bavop/.ssh/idlab
  children:
    endpoints:
      hosts:
        Affymetrix:     { ansible_host: 10.10.160.149, endpoint_port: 3002, endpoint_engine: qlever }
        ChEBI:          { ansible_host: 10.10.160.149, endpoint_port: 3003, endpoint_engine: qlever }
        DBPedia-Subset: { ansible_host: 10.10.160.149, endpoint_port: 3004, endpoint_engine: qlever }
        DrugBank:       { ansible_host: 10.10.160.149, endpoint_port: 3005, endpoint_engine: qlever }
        GeoNames:       { ansible_host: 10.10.160.149, endpoint_port: 3006, endpoint_engine: qlever }
        Jamendo:        { ansible_host: 10.10.160.149, endpoint_port: 3007, endpoint_engine: qlever }
        KEGG:           { ansible_host: 10.10.160.149, endpoint_port: 3008, endpoint_engine: qlever }
        LinkedTCGA-A:   { ansible_host: 10.10.160.149, endpoint_port: 3009, endpoint_engine: qlever }
        LinkedTCGA-E:   { ansible_host: 10.10.160.149, endpoint_port: 3010, endpoint_engine: qlever }
        LinkedTCGA-M:   { ansible_host: 10.10.160.149, endpoint_port: 3011, endpoint_engine: qlever }
        LMDB:           { ansible_host: 10.10.160.149, endpoint_port: 3012, endpoint_engine: qlever }

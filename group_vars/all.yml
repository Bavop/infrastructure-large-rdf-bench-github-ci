# --- Testbed provisioning -----------------------------------------------------
# Base URL that serves the imec Virtual Wall helper scripts.
wall_scripts_base: https://www.wall2.ilabt.iminds.be
# Enlarge the root partition to fill the physical disk(s) (reboots the node).
expand_root_disk: false
# Enable outbound IPv4 via NAT (IPv6 is on by default but GitHub/DockerHub/npm
# are effectively IPv4-only). Re-applied every run -- it is not reboot-persistent.
enable_nat: true

# --- QLever --------------------------------------------------------------
# Each dataset gets its own index/container/port
endpoint_port: 3002
endpoint_data_dir: "{{ ansible_env.HOME }}/data/rdf_datasets"
qlever_image: adfreiburg/qlever
qlever_container_name: qlever-endpoint
# 13 of these run concurrently on a 23G host -- keep each one's budget small.
# Even so, their on-disk indexes (several multi-GB) all compete for the same
# page cache, so expect I/O-bound slowdowns under concurrent load, not just
# "no crash".
qlever_memory_max: "1G"
qlever_cache_max: "256M"
qlever_cache_entries: 0
qlever_index_memory: "12G"
qlever_query_timeout: "1800s"
# Gates every query, not just QLever's own privileged admin endpoints --
# enforced by Caddy in front of QLever (see templates/Caddyfile.j2). Kept
# here in cleartext for now, per request -- change it if that stops being
# acceptable (this file is tracked in git).
qlever_access_token: "verysecret"

# --- Caddy -----------------------------------------------------------------
# Fronts every dataset's QLever container on this host: enforces the access
# token on every request and is the only thing with a port published to the
# host (QLever itself sits on a private docker network). See
# tasks/start_endpoint.yml for why the Caddy tasks there use run_once.
caddy_image: caddy:2-alpine
caddy_container_name: caddy-endpoint
qlever_docker_network: qlever-net
